schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type AuthSuccessResponse {
  token: String!
}

type Conversation {
  id: ID!
  messages: [Message!]!
  title: String!
}

type ConversationMessageChunk {
  conversationId: ID!
  done: Boolean
  messageChunk: String!
  messageId: ID!
  previousMessageId: ID!
}

scalar DateTime

type Error {
  message: String!
}

enum FileType {
  PDF
  TEXT
}

type FileUpload {
  createdAt: DateTime!
  id: ID!
  originalName: String!
  type: FileType!
}

input FileUploadInput {
  file: Upload!
}

type Message {
  content: String!
  id: ID!
  role: MessageRole!
}

enum MessageRole {
  ASSISTANT
  SYSTEM
  USER
}

type Mutation {
  completeMagicLink(token: String!): MutationCompleteMagicLinkResult!
  deleteConversation(conversationId: Int!): MutationDeleteConversationResult!
  deleteFileUpload(fileId: Int!): MutationDeleteFileUploadResult!
  magicLink(email: String!): MutationMagicLinkResult!
  uploadFile(input: FileUploadInput!): MutationUploadFileResult!
}

union MutationCompleteMagicLinkResult = Error | MutationCompleteMagicLinkSuccess

type MutationCompleteMagicLinkSuccess {
  data: AuthSuccessResponse!
}

union MutationDeleteConversationResult = Error | MutationDeleteConversationSuccess

type MutationDeleteConversationSuccess {
  data: Boolean!
}

union MutationDeleteFileUploadResult = Error | MutationDeleteFileUploadSuccess

type MutationDeleteFileUploadSuccess {
  data: Boolean!
}

union MutationMagicLinkResult = Error | MutationMagicLinkSuccess

type MutationMagicLinkSuccess {
  data: Boolean!
}

union MutationUploadFileResult = Error | MutationUploadFileSuccess

type MutationUploadFileSuccess {
  data: FileUpload!
}

type Query {
  conversation(conversationId: Int!): Conversation
  conversations: [Conversation!]
  currentUser: user
  files: [FileUpload!]
}

type Subscription {
  conversation(conversationId: Int, message: String!): SubscriptionConversationResult
}

union SubscriptionConversationResult = Error | SubscriptionConversationSuccess

type SubscriptionConversationSuccess {
  data: ConversationMessageChunk!
}

scalar Upload

type user {
  email: String!
  firstName: String
  id: ID!
  lastName: String
  pictureUrl: String
}