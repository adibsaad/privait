type Conversation {
	id: ID!
	title: String!
	archived: Boolean!
	projectId: Int
	messages: [Message!]!
}

type ConversationMessageChunk {
	conversationId: ID!
	previousMessageId: ID!
	messageId: ID!
	messageChunk: String!
	done: Boolean
}

"""
Shared failure type behind the `Error { message }` union arm pattern
carried over from the existing schema.
"""
type Error {
	message: String!
}

enum FileStatus {
	UPLOADED
	PROCESSED
}

enum FileType {
	PDF
	TEXT
}

type FileUpload {
	id: ID!
	originalName: String!
	type: FileType!
	status: FileStatus!
	createdAt: String!
}

"""
`input: FileUploadInput!` — kept for the old schema's shape even though it
only carries the upload.
"""
input FileUploadInput {
	file: Upload!
}

"""
A stored memory: durable fact with source + provenance.
"""
type Memory {
	id: ID!
	content: String!
	source: MemorySource!
	conversationId: Int
	createdAt: String!
	updatedAt: String!
}

enum MemorySource {
	MANUAL
	DISTILLED
}

input MemoryUpdateInput {
	id: Int!
	content: String!
}

type Message {
	id: ID!
	role: MessageRole!
	content: String!
	"""
	Attachments carried by this message — lets chat history re-render
	the file chips after a reload.
	"""
	files: [FileUpload!]!
}

enum MessageRole {
	USER
	ASSISTANT
	SYSTEM
}

type Mutation {
	deleteConversation(conversationId: Int!): MutationDeleteConversationResult!
	renameConversation(conversationId: Int!, title: String!): MutationRenameConversationResult!
	archiveConversation(conversationId: Int!, archived: Boolean!): MutationArchiveConversationResult!
	saveSettings(input: SettingsInput!): MutationSaveSettingsResult!
	"""
	Persists a validated upload (5MB cap, MIME allowlist) to storage and
	the `files` table, then runs the extract → chunk → embed pipeline
	inline and returns the PROCESSED row. Upload happens on send, so the
	user is waiting on the result — background processing (the apalis
	worker) is no longer in this path. On pipeline failure the upload is
	rolled back so nothing lingers unprocessed.
	"""
	uploadFile(input: FileUploadInput!): MutationUploadFileResult!
	"""
	Removes the upload, its stored bytes, and its vector chunks.
	"""
	deleteFileUpload(fileId: Int!): MutationDeleteFileUploadResult!
	"""
	Server-side half of the stop button: cancels the conversation's
	in-flight reply; the pump task then persists whatever streamed so
	far. `false` when no reply is in flight (late stop press).
	"""
	stopRun(conversationId: Int!): Boolean!
	"""
	Creates a project: name + optional instructions. Local-only container
	for chats and knowledge.
	"""
	createProject(name: String!, instructions: String): MutationCreateProjectResult!
	renameProject(projectId: Int!, name: String!): MutationRenameProjectResult!
	"""
	Sets the project's standing instructions, applied to every chat in
	the project.
	"""
	updateProjectInstructions(projectId: Int!, instructions: String!): MutationUpdateProjectInstructionsResult!
	"""
	Deletes a project: its chats survive as plain chats (project_id goes
	NULL) and its knowledge files are removed with their chunks and bytes.
	"""
	deleteProject(projectId: Int!): MutationDeleteProjectResult!
	"""
	Claims uploaded files into the project's knowledge folder (the same
	inline extract→chunk→embed upload path as chat attachments). Only
	unattached uploads are claimed.
	"""
	addProjectKnowledge(projectId: Int!, fileIds: [Int!]!): MutationAddProjectKnowledgeResult!
	"""
	Writes a memory by hand — the explicit path (the automatic one is the
	post-chat distillation job). Visible in the Memories UI immediately.
	"""
	createMemory(content: String!): MutationCreateMemoryResult!
	"""
	Rewrites a memory; the vector re-embeds (same id).
	"""
	updateMemory(input: MemoryUpdateInput!): MutationUpdateMemoryResult!
	deleteMemory(memoryId: Int!): MutationDeleteMemoryResult!
	"""
	Incognito per chat: no memory reads, no distillation writes, no
	search hits. Existing memories are untouched.
	"""
	setConversationIncognito(conversationId: Int!, incognito: Boolean!): Boolean!
}

union MutationAddProjectKnowledgeResult = Error | MutationAddProjectKnowledgeSuccess

type MutationAddProjectKnowledgeSuccess {
	data: Boolean!
}

union MutationArchiveConversationResult = Error | MutationArchiveConversationSuccess

type MutationArchiveConversationSuccess {
	data: Boolean!
}

union MutationCreateMemoryResult = Error | MutationCreateMemorySuccess

type MutationCreateMemorySuccess {
	data: Memory!
}

union MutationCreateProjectResult = Error | MutationCreateProjectSuccess

type MutationCreateProjectSuccess {
	data: Project!
}

union MutationDeleteConversationResult = Error | MutationDeleteConversationSuccess

type MutationDeleteConversationSuccess {
	data: Boolean!
}

union MutationDeleteFileUploadResult = Error | MutationDeleteFileUploadSuccess

type MutationDeleteFileUploadSuccess {
	data: Boolean!
}

union MutationDeleteMemoryResult = Error | MutationDeleteMemorySuccess

type MutationDeleteMemorySuccess {
	data: Boolean!
}

union MutationDeleteProjectResult = Error | MutationDeleteProjectSuccess

type MutationDeleteProjectSuccess {
	data: Boolean!
}

union MutationRenameConversationResult = Error | MutationRenameConversationSuccess

type MutationRenameConversationSuccess {
	data: Boolean!
}

union MutationRenameProjectResult = Error | MutationRenameProjectSuccess

type MutationRenameProjectSuccess {
	data: Boolean!
}

union MutationSaveSettingsResult = Error | MutationSaveSettingsSuccess

type MutationSaveSettingsSuccess {
	data: Settings!
}

union MutationUpdateMemoryResult = Error | MutationUpdateMemorySuccess

type MutationUpdateMemorySuccess {
	data: Boolean!
}

union MutationUpdateProjectInstructionsResult = Error | MutationUpdateProjectInstructionsSuccess

type MutationUpdateProjectInstructionsSuccess {
	data: Boolean!
}

union MutationUploadFileResult = Error | MutationUploadFileSuccess

type MutationUploadFileSuccess {
	data: FileUpload!
}

type Project {
	id: ID!
	name: String!
	instructions: String!
	createdAt: String!
	updatedAt: String!
	"""
	This project's live chats, newest first (archive state lives on the
	conversation rows; archived chats stay out of the project stat here).
	"""
	conversations: [Conversation!]!
}

type Query {
	"""
	Liveness check for the in-process API server.
	"""
	health: String!
	"""
	Resolves locally; kept so the frontend's user context keeps working.
	"""
	currentUser: user!
	conversations: [Conversation!]!
	conversation(conversationId: Int!): Conversation
	"""
	All projects, oldest first — the sidebar's project groups.
	"""
	projects: [Project!]!
	project(projectId: Int!): Project
	settings: Settings!
	"""
	All uploaded files, oldest first (matches the old resolver's ordering).
	"""
	files: [FileUpload!]!
	"""
	All stored memories, newest first. Every memory is visible here —
	distilled ones carry the chat that produced them.
	"""
	memories: [Memory!]!
	"""
	Full-text search over transcripts: project-scoped by default (the
	project of the conversation asking), `wholeVault` widens to all
	chats, incognito chats always excluded. Tool-loop exposure lands in
	0004.
	"""
	searchHistory(query: String!, conversationId: Int!, wholeVault: Boolean): [SearchResult!]!
}

"""
One transcript hit from the full-text search.
"""
type SearchResult {
	conversationId: Int!
	conversationTitle: String!
	messageId: ID!
	snippet: String!
}

type Settings {
	baseUrl: String!
	apiKey: String!
	model: String!
}

input SettingsInput {
	baseUrl: String!
	apiKey: String!
	model: String!
}

type Subscription {
	"""
	Starts (or continues) a chat turn. `conversationId` omitted creates a
	conversation; the new user message and an empty assistant message are
	persisted up front, then provider chunks stream over this subscription.
	
	`fileIds` are uploads sent with this turn (the composer uploads them
	right before subscribing). They are attached to the user message here;
	file chunks from this conversation ground the turn. `message` may be
	empty when files are attached — the model then receives a synthesized
	instruction while the bubble keeps just the chips.
	
	Run safety: one reply per conversation at a time — a second send while
	a reply is streaming gets an `Error` arm instead of racing it. Stop
	works two ways: dropping the subscription (stop button unsubscribe /
	disconnect) drops the receiver below and the pump aborts on the next
	send attempt, and the `stopRun` mutation cancels the run outright via
	the run registry — which also aborts when no chunk is flowing. Either
	way the partial reply is persisted.
	"""
	conversation(conversationId: Int, message: String!, fileIds: [Int!], projectId: Int): SubscriptionConversationResult!
}

union SubscriptionConversationResult = Error | SubscriptionConversationSuccess

type SubscriptionConversationSuccess {
	data: ConversationMessageChunk!
}

"""
A multipart file upload
"""
scalar Upload

"""
The single local user; no auth machinery exists in the desktop app.
"""
type user {
	id: ID!
	email: String!
	firstName: String
	lastName: String
	pictureUrl: String
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
