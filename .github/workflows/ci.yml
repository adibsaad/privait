name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services
        run: |
          docker-compose up -d
          docker-compose ps

      - name: Setup database
        run: |
          pnpm db:create
          pnpm db:drizzle:push:test

      - name: Run tests
        run: pnpm test
