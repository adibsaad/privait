# cargo-about config for the third-party licenses notice (about.hbs).
# `accepted` entries are single SPDX identifiers; a crate is accepted when its
# whole license expression is covered by these. Regenerate licenses.html with:
#   cd src-tauri && cargo about generate about.hbs > resources/licenses.html
accepted = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]